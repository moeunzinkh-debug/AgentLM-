name: CI Debug

# TEMPORARY workflow used to surface the real Gradle failure.
# It mirrors .github/workflows/build.yml exactly, then posts the build log
# as a commit comment so it can be read back through the GitHub API.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Secrets and Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        id: gradle
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          echo "===== LAST 200 LINES OF BUILD LOG ====="
          tail -n 200 build.log
        continue-on-error: true

      - name: Post build log as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "exit code: ${{ steps.gradle.outputs.exit_code }}"
          {
            echo "### CI Debug build log for ${GITHUB_SHA}"
            echo '```'
            # Skip the huge Java stack trace, keep the meaningful part.
            awk '/^\* Exception is:/{exit} {print}' build.log | tail -c 20000
            echo '```'
          } > report.md
          jq -Rs '{body: .}' report.md > payload.json
          gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --input payload.json -H "Accept: application/vnd.github+json" > /dev/null
          echo "comment posted"
